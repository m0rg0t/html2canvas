name: Current library verification
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run unittest -- --runInBand
      - run: npm run build
      - run: npm run test:artifacts
      - run: npm pack --dry-run --ignore-scripts
      - run: npm run test:tooling
      - run: node --test scripts/legacy-mocha.test.cjs scripts/screenshot-upload.test.cjs scripts/sauce-compatibility.test.cjs
      - name: Check out original renderer for visual comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: m0rg0t/html2canvas
          ref: 6020386bbeed60ad68e675fdcaa6220e292fd35a
          path: .maintenance-baseline
          persist-credentials: false
      - name: Build original renderer with its committed dependency graph
        working-directory: .maintenance-baseline
        run: |
          npm ci --ignore-scripts --no-audit
          npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rendering
        env:
          BASELINE_BUNDLE: .maintenance-baseline/dist/html2canvas.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-dist
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-browser-tests
          path: build
          if-no-files-found: error
  browser:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: Chrome_Stable
          - os: ubuntu-latest
            browser: Firefox_Stable
          - os: macos-15
            browser: Safari_Stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      TARGET_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-browser-tests
          path: build
      - name: Run Linux browser fixtures
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run karma
      - name: Run native Safari fixtures
        if: runner.os == 'macOS'
        run: npm run karma
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-screenshots-${{ matrix.browser }}
          path: tmp/reftests
          if-no-files-found: error
  consumer-node8:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-dist
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 8.17.0
      - name: Import the published CommonJS bundle on its minimum Node major
        run: node -e "require('assert').strictEqual(typeof require('./dist/html2canvas.js'), 'function')"
  legacy-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Verify retained browser-tool API with patched dependencies
        timeout-minutes: 2
        run: CHROME_PATH="$(command -v google-chrome)" xvfb-run --auto-servernum npm run test:legacy-browser
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
  website:
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GATSBY_TELEMETRY_DISABLED: '1'
      GATSBY_CPU_COUNT: '2'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out original website for comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: m0rg0t/html2canvas
          ref: 6020386bbeed60ad68e675fdcaa6220e292fd35a
          path: .maintenance-website-baseline
          persist-credentials: false
      - name: Download the same synthetic browser results for both website builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: verification-screenshots-*
          merge-multiple: true
          path: .website-results
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 16.20.2
      - name: Build the original library and website with its historical toolchain
        working-directory: .maintenance-website-baseline
        run: |
          npm ci --ignore-scripts --no-audit
          npm run build
          npm ci --ignore-scripts --no-audit --prefix www
          mkdir -p www/static/tests www/static/results
          cp -R tests/reftests www/static/tests/reftests
          cp -R tests/assets www/static/tests/assets
          cp tests/test.js www/static/tests/test.js
          cp -R ../.website-results/. www/static/results/
          npm run build:reftest-result-list -- www/static/results/metadata www/src/results.json
          npm run build:reftest-preview
          npm run build --prefix www
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-dist
          path: dist
      - run: npm ci --ignore-scripts --no-audit --prefix www
      - run: npm run test:website-deps
      - run: node --test scripts/website-migration.test.cjs scripts/copy-website.test.cjs
      - name: Build the current website and reftest previewer
        run: |
          mkdir -p www/static/tests www/static/results
          cp -R tests/reftests www/static/tests/reftests
          cp -R tests/assets www/static/tests/assets
          cp tests/test.js www/static/tests/test.js
          cp -R .website-results/. www/static/results/
          npm run build:reftest-result-list -- www/static/results/metadata www/src/results.json
          npm run build:reftest-preview
          npm run build --prefix www
      - run: npx playwright install --with-deps chromium
      - run: npm run test:website && node scripts/website-interactions.mjs
        env:
          BASELINE_SITE: .maintenance-website-baseline/www/public
      - name: Upload verified website comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-comparisons
          path: test-results/website
          if-no-files-found: ignore
